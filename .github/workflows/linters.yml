name: Linters

on: pull_request

env:
  FORCE_COLOR: 1

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest # Using the latest stable Ubuntu version
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20.x" # Using a more recent LTS version
      - name: Setup Lighthouse
        run: npm install -g @lhci/cli # Consider pinning to a specific stable version for consistency
      - name: Lighthouse Report
        run: lhci autorun --upload.target=temporary-public-storage --collect.staticDistDir=.

  webhint:
    name: Webhint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: Setup Webhint
        run: npm install --save-dev hint # Consider pinning to a specific stable version
      - name: Webhint Report
        run: npx hint .

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: Setup Stylelint
        run: npm install --save-dev stylelint stylelint-scss stylelint-config-standard stylelint-csstree-validator # Consider pinning to specific stable versions
      - name: Stylelint Report
        run: npx stylelint "**/*.{css,scss}"

  nodechecker:
    name: node_modules checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check node_modules existence
        run: |
          if [ -d "node_modules/" ]; then
            echo -e "\e[1;31mError: The node_modules/ folder was pushed to the repo. Please remove it and ensure it's in your .gitignore file.\e[0m"
            exit 1
          fi